name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth knowing first — a few things are settled rather than open:
        single-user only, no AI features in the app, and new features must be
        optional (switchable off in Settings → Modules).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This works for a single user (not a team feature)
          required: true
        - label: This does not require an AI/LLM call at runtime
          required: true
